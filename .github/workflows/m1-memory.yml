name: M1 Guest Memory

on:
  pull_request:
    paths:
      - ".github/workflows/m1-memory.yml"
      - "runtime/guest/**"
      - "corpus/m1/memory*"
      - "corpus/m1/lea*"
      - "corpus/m1/scalar*"
      - "corpus/m1/console-ops*"
      - "corpus/m1/sse2-memory*"
      - "corpus/m1/sse2-shifts*"
      - "corpus/m1/xmm-moves*"
      - "corpus/m1/check_memory_ops.sh"
      - "lift/**"
      - "detect/**"
      - "Cargo.*"
  push:
    branches: [main]
    paths:
      - ".github/workflows/m1-memory.yml"
      - "runtime/guest/**"
      - "corpus/m1/memory*"
      - "corpus/m1/lea*"
      - "corpus/m1/scalar*"
      - "corpus/m1/console-ops*"
      - "corpus/m1/sse2-memory*"
      - "corpus/m1/sse2-shifts*"
      - "corpus/m1/xmm-moves*"
      - "corpus/m1/check_memory_ops.sh"
      - "lift/**"
      - "detect/**"
      - "Cargo.*"

permissions:
  contents: read

jobs:
  bounds:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iruntime/guest corpus/m1/memory.c -o "$RUNNER_TEMP/memory"
          "$RUNNER_TEMP/memory"
  reference:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.compare.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: compare
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo fetch --locked
          mkdir -p evidence
          for suite in lea scalar console-ops sse2-memory sse2-shifts xmm-moves; do
            bash corpus/m1/check_memory_ops.sh "$suite" > "evidence/$suite.txt"
            printf '%s ' "$suite"
            cat "evidence/$suite.txt"
          done
          bash corpus/m1/check_memory_ops.sh scalar-shifts > evidence/scalar-shifts.txt
          cat evidence/scalar-shifts.txt
          printf 'digest=%s\n' "$(sha256sum evidence/*.txt | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guest-memory-x86-reference
          path: evidence/
          if-no-files-found: error
  arm64:
    needs: reference
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo fetch --locked
          mkdir -p evidence
          for suite in lea scalar console-ops sse2-memory sse2-shifts xmm-moves; do
            bash corpus/m1/check_memory_ops.sh "$suite" > "evidence/$suite.txt"
            printf '%s ' "$suite"
            cat "evidence/$suite.txt"
          done
          bash corpus/m1/check_memory_ops.sh scalar-shifts > evidence/scalar-shifts.txt
          cat evidence/scalar-shifts.txt
          test "$(sha256sum evidence/*.txt | sha256sum | cut -d ' ' -f1)" = "$REFERENCE_DIGEST"
        env:
          REFERENCE_DIGEST: ${{ needs.reference.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guest-memory-arm64
          path: evidence/
          if-no-files-found: error
