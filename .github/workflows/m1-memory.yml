name: M1 Guest Memory

on:
  pull_request:
    paths:
      - ".github/workflows/m1-memory.yml"
      - "runtime/guest/memory.h"
      - "corpus/m1/memory.c"
      - "corpus/m1/lea*"
      - "corpus/m1/check_memory_ops.sh"
      - "lift/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/m1-memory.yml"
      - "runtime/guest/memory.h"
      - "corpus/m1/memory.c"
      - "corpus/m1/lea*"
      - "corpus/m1/check_memory_ops.sh"
      - "lift/**"

permissions:
  contents: read

jobs:
  bounds:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iruntime/guest corpus/m1/memory.c -o "$RUNNER_TEMP/memory"
          "$RUNNER_TEMP/memory"
      - run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo fetch --locked
          bash corpus/m1/check_memory_ops.sh lea
