name: M1 Guest Memory

on:
  pull_request:
    paths:
      - ".github/workflows/m1-memory.yml"
      - "runtime/guest/memory.h"
      - "corpus/m1/memory.c"
  push:
    branches: [main]
    paths:
      - ".github/workflows/m1-memory.yml"
      - "runtime/guest/memory.h"
      - "corpus/m1/memory.c"

permissions:
  contents: read

jobs:
  bounds:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iruntime/guest corpus/m1/memory.c -o "$RUNNER_TEMP/memory"
          "$RUNNER_TEMP/memory"
