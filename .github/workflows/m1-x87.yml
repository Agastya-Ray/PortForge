name: M1 x87 Arithmetic and State

on:
  pull_request:
    paths:
      - ".github/workflows/m1-x87.yml"
      - "corpus/m1/**"
      - "runtime/guest/**"
      - "lift/spike/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/m1-x87.yml"
      - "corpus/m1/**"
      - "runtime/guest/**"
      - "lift/spike/**"

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.reference.outputs.digest }}
      stack_digest: ${{ steps.reference.outputs.stack_digest }}
      memory_digest: ${{ steps.reference.outputs.memory_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: reference
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo fetch --locked
          bash corpus/m1/prepare_softfloat.sh "$RUNNER_TEMP/softfloat"
          bash corpus/m1/check_x87_add.sh "$RUNNER_TEMP/softfloat" evidence
          bash corpus/m1/check_x87_stack.sh "$RUNNER_TEMP/softfloat" evidence
          bash corpus/m1/check_memory_ops.sh x87-memory "$RUNNER_TEMP/softfloat" | tee evidence/x87-memory.txt
          printf 'memory_digest=%s\n' "$(cat evidence/x87-memory.txt)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("evidence/x87-add.json") as report:
              result = json.load(report)
          assert result["native_x86_oracle"]
          print("digest=" + result["digest"])
          with open("evidence/x87-stack.json") as report:
              stack = json.load(report)
          assert stack["native_x86_oracle"]
          print("stack_digest=" + stack["digest"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: x87-x86-reference
          path: evidence/
          if-no-files-found: error

  arm64:
    needs: reference
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - env:
          REFERENCE_DIGEST: ${{ needs.reference.outputs.digest }}
          STACK_DIGEST: ${{ needs.reference.outputs.stack_digest }}
          MEMORY_DIGEST: ${{ needs.reference.outputs.memory_digest }}
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo fetch --locked
          bash corpus/m1/prepare_softfloat.sh "$RUNNER_TEMP/softfloat"
          bash corpus/m1/check_x87_add.sh "$RUNNER_TEMP/softfloat" evidence
          bash corpus/m1/check_x87_stack.sh "$RUNNER_TEMP/softfloat" evidence
          bash corpus/m1/check_memory_ops.sh x87-memory "$RUNNER_TEMP/softfloat" | tee evidence/x87-memory.txt
          test "$(cat evidence/x87-memory.txt)" = "$MEMORY_DIGEST"
          python3 - <<'PY'
          import json, os
          with open("evidence/x87-add.json") as report:
              result = json.load(report)
          assert not result["native_x86_oracle"]
          assert result["digest"] == os.environ["REFERENCE_DIGEST"], result
          with open("evidence/x87-stack.json") as report:
              stack = json.load(report)
          assert not stack["native_x86_oracle"]
          assert stack["digest"] == os.environ["STACK_DIGEST"], stack
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: x87-arm64
          path: evidence/
          if-no-files-found: error
