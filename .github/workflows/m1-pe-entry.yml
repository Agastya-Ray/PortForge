name: M1 PE Entry Execution

on:
  pull_request:
    paths:
      - ".github/workflows/m1-pe-entry.yml"
      - "corpus/m1/*pe-entry*"
      - "corpus/m1/check_pe_entry.sh"
      - "corpus/m1/*pe-import*"
      - "corpus/m1/check_pe_import.sh"
      - "corpus/m1/pe_import_fixture.py"
      - "detect/**"
      - "lift/**"
      - "runtime/guest/**"
      - "Cargo.*"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo fetch --locked
          bash corpus/m1/check_pe_entry.sh evidence
          bash corpus/m1/check_pe_import.sh evidence/import
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pe-entry-x86-reference
          path: evidence/
          if-no-files-found: error

  arm64:
    needs: reference
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pe-entry-x86-reference
          path: reference/
      - run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo fetch --locked
          bash corpus/m1/check_pe_entry.sh evidence reference
          bash corpus/m1/check_pe_import.sh evidence/import reference/import
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pe-entry-arm64
          path: evidence/
          if-no-files-found: error
