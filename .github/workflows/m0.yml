name: M0 Foundations

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt
      - run: |
          cargo +1.85.1 fmt --all --check
          python3 corpus/check_offline.py
          cargo +1.85.1 fetch --locked
          cargo +1.85.1 test --workspace --locked --offline
      - name: Rebuild and compare executable hashes
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          for run in first second; do
            cargo +1.85.1 clean
            cargo +1.85.1 build --workspace --release --locked --offline
            sha256sum target/release/pf target/release/pf-ir-spike > "$RUNNER_TEMP/pf-$run.sha256"
          done
          diff "$RUNNER_TEMP/pf-first.sha256" "$RUNNER_TEMP/pf-second.sha256"
          python3 corpus/check_detect.py target/release/pf evidence
          cp "$RUNNER_TEMP"/pf-*.sha256 evidence/
      - name: Verify packed and unpacked PE samples
        env:
          PE_OBJDUMP: x86_64-w64-mingw32-objdump
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl python3-venv binutils-mingw-w64-x86-64
          python3 -m venv "$RUNNER_TEMP/corpus-venv"
          "$RUNNER_TEMP/corpus-venv/bin/python" -m pip download --require-hashes --only-binary=:all: --no-deps \
            --dest "$RUNNER_TEMP/fixtures" -r corpus/fixtures.requirements.txt
          python3 corpus/check_packed.py target/release/pf upx-ucl evidence/real "$RUNNER_TEMP"/fixtures/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m0-${{ matrix.os }}
          path: evidence/
          if-no-files-found: error
