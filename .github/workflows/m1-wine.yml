name: M1 Wine Import Execution

on:
  pull_request:
    paths:
      - ".github/workflows/m1-wine.yml"
      - "corpus/m1/*pe-wine*"
      - "corpus/m1/check_pe_wine.sh"
      - "corpus/m1/*pe-console*"
      - "corpus/m1/check_pe_console*"
      - "corpus/m1/build_pe_console_msvc.cmd"
      - "corpus/m1/pe-import.s"
      - "corpus/m1/pe_import_fixture.py"
      - "runtime/**"
      - "detect/**"
      - "lift/**"
      - "Cargo.*"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  msvc:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: cmd
        run: call corpus\m1\build_pe_console_msvc.cmd evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wine-msvc-native-windows
          path: evidence/
          if-no-files-found: error

  reference:
    needs: msvc
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wine-msvc-native-windows
          path: msvc-reference/
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wine64 wine64-tools clang-19 lld-19 gcc-mingw-w64-x86-64-posix
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo fetch --locked
          bash corpus/m1/check_pe_wine.sh evidence
          WINDOWS_CC=clang-19 LLD_LINK=lld-link-19 bash corpus/m1/check_pe_console.sh evidence/console/clang
          MINGW_CC=x86_64-w64-mingw32-gcc-posix bash corpus/m1/check_pe_console.sh evidence/console/mingw "" mingw
          bash corpus/m1/check_pe_console.sh evidence/console/msvc msvc-reference msvc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wine-x86-reference
          path: evidence/
          if-no-files-found: error

  arm64:
    needs: reference
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    # Noble's ARM64 Wine 9 hangs at startup (Launchpad #2102681).
    # Debian 13 ships the Clang-built ARM64 Wine 10 (Debian #1100695).
    container: debian:13-slim
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git gcc g++ clang lld libc6-dev make cmake cargo rustc python3 wine64 wine64-tools
          rustc --version | grep '^rustc 1\.85\.1 '
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wine-x86-reference
          path: reference/
      - run: |
          cargo fetch --locked
          unset TMPDIR
          bash corpus/m1/check_pe_wine.sh evidence reference
          for compiler in clang mingw msvc; do
            bash corpus/m1/check_pe_console.sh "evidence/console/$compiler" "reference/console/$compiler" "$compiler"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wine-arm64
          path: evidence/
          if-no-files-found: error
