name: M1 Arithmetic Lifter Experiment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.reference.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.85.1 --profile minimal
      - id: reference
        run: |
          rustup override set 1.85.1
          bash corpus/m1/check_arithmetic.sh evidence
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("evidence/arithmetic.json") as report:
              result = json.load(report)
          assert result["native_x86_oracle"]
          print("digest=" + result["digest"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arithmetic-x86-64-reference
          path: evidence/
          if-no-files-found: error

  arm64:
    needs: reference
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.85.1 --profile minimal
      - env:
          REFERENCE_DIGEST: ${{ needs.reference.outputs.digest }}
        run: |
          rustup override set 1.85.1
          bash corpus/m1/check_arithmetic.sh evidence
          python3 - <<'PY'
          import json, os
          with open("evidence/arithmetic.json") as report:
              result = json.load(report)
          assert not result["native_x86_oracle"]
          assert result["digest"] == os.environ["REFERENCE_DIGEST"], result
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arithmetic-arm64
          path: evidence/
          if-no-files-found: error
